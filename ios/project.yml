name: PodcastNotesRemote
options:
  bundleIdPrefix: com.iorikawano
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: ja

settings:
  base:
    SWIFT_VERSION: "5.0"
    ENABLE_PREVIEWS: YES

targets:
  PodcastNotesRemote:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: PodcastNotesRemote
    info:
      path: PodcastNotesRemote/App/Info.plist
      properties:
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        CFBundleURLTypes:
          - CFBundleURLName: com.iorikawano.podcastnotesremote
            CFBundleURLSchemes:
              - podcastnotes
        # 自宅 LAN / Tailscale の平文 HTTP に繋ぐため、ローカル宛の ATS 例外を許可する
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        NSLocalNetworkUsageDescription: "同じネットワーク上の Mac のジョブサーバに接続します。"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.iorikawano.podcastnotesremote
        PRODUCT_NAME: "Podcast Notes"
        TARGETED_DEVICE_FAMILY: "1"
        SUPPORTS_MACCATALYST: NO
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        DEVELOPMENT_ASSET_PATHS: "PodcastNotesRemote/Resources"

schemes:
  PodcastNotesRemote:
    build:
      targets:
        PodcastNotesRemote: all
    run:
      config: Debug
    archive:
      config: Release
